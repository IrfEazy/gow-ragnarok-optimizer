[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gow-optimizer"
version = "0.1.0"
description = "God of War Ragnarök — Build Optimizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "flask>=3.1.0",
  "lxml>=5.3.0",
  "pandas>=2.2.3",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
  "types-requests>=2.32.4.20260107",
]

[project.scripts]
gow-web = "gow_optimizer.web:main"

[dependency-groups]
dev = ["pytest>=8.3.5", "types-PyYAML>=6.0.12.20250915"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["gow_optimizer"]

[tool.hatch.build.targets.wheel.force-include]
"gow_optimizer/templates" = "gow_optimizer/templates"

[tool.hatch.build.targets.sdist]
include = [
  "/gow_optimizer",
  "/tests",
  "/data",
  "/README.md",
  "/config.yaml",
  "/main.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
